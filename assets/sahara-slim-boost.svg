  <text x="630" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1f803e" font-weight="600">ALFALFA · SPINACH</text>
  <text x="630" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#1f803e" font-weight="600">DANDELION LEAVES · BURDOCK</text>
