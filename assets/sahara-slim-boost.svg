<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Slim Boost 7 Greens hero image</title>
  <desc id="desc">Packaging for a plant based supplement with a measuring tape and leaves on a neutral background.</desc>
  <defs>
    <linearGradient id="box" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6b38b1" />
      <stop offset="60%" stop-color="#6f3ebd" />
      <stop offset="100%" stop-color="#1fb15f" />
    </linearGradient>
    <linearGradient id="shadow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#ede5d9" />
