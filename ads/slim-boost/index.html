<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعلان Slim Boost | Sahara Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Almarai:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="ad-wrapper" aria-label="Slim Boost HTML5 ad">
    <div class="bg-layer" role="presentation">
      <img src="../../assets/sahara-slim-boost.svg" alt="" loading="lazy">
      <span class="gradient"></span>
    </div>

    <div class="ad-content">
      <div class="logo" aria-label="Sahara Store">
        <div class="logo-icon" aria-hidden="true">S</div>
        <div>
          <div class="logo-name">SAHARA STORE</div>
          <small>معززات طبيعية</small>
        </div>
      </div>

      <div class="hero-copy">
        <h1>SLIM BOOST - خطوة صغيرة تغيّر كل يومك</h1>
        <p>تركيبة نباتية بالكامل ومناسبة للكيتو</p>
        <ul>
          <li>تركيز عالٍ من 7 خضار داعمة للحرق</li>
          <li>صفر سكر مضاف · خالي من اللاكتوز والجلوتين</li>
        </ul>
      </div>

      <div class="cta">
        <div class="badges" aria-label="مزايا المنتج">
          <div class="badge">شحن سريع وخدمة مميزة</div>
          <div class="badge">دعم كامل للكيتو</div>
          <div class="badge">نتيجة ملحوظة من أول أسبوع</div>
        </div>
        <a class="button" href="https://saharastore.example/offer" target="_blank" rel="noreferrer noopener">
          اطلبه الآن
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
